<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WA Chats Backup Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>WA Chats Backup</h1>
        <p class="sub">WPP Store · Markdown · Media</p>
      </div>
    </div>
  </header>
  <main>
    <div class="card">
      <p class="hint" id="status">检测 WhatsApp Web…</p>
      <button id="btn-open" class="btn primary">打开面板</button>
      <button id="btn-export-active" class="btn">导出当前聊天</button>
      <button id="btn-open-wa" class="btn ghost">打开 WhatsApp Web</button>
    </div>
    <div class="card tips">
      <h2>使用</h2>
      <ol>
        <li>登录 <b>web.whatsapp.com</b> 并刷新</li>
        <li>点聊天栏绿色按钮打开面板</li>
        <li>点「诊断 WPP」确认就绪</li>
        <li>勾选聊天 → 导出 MD / ZIP（含媒体）</li>
      </ol>
      <p class="hint">数据来自页面内 WPPConnect Store，不是 DOM 扫描。</p>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
